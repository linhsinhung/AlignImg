[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alignimg-gui"
version = "0.6.0"
description = "PyQt6 development workbench for AlignImg 2D cryo-EM alignment."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "Hsin-Hung Lin"}]
dependencies = [
  "alignimg>=2,<3",
  "mrcfile>=1.5",
  "numpy",
  "PyQt6>=6.6",
  "pyqtgraph>=0.13",
]

[project.scripts]
alignimg-gui = "alignimg_gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]
