[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alignimg"
version = "2.2.0"
description = "Reference-free, multi-reference, and robust 2D cryo-EM alignment."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Hsin-Hung Lin"}
]
license = "GPL-3.0-or-later"
license-files = [
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
  "Reference/re2dc/LICENSE",
  "Reference/re2dc/THIRD_PARTY_NOTICES.md",
  "Reference/re2dc-gpu/LICENSE",
  "Reference/re2dc-gpu/THIRD_PARTY_NOTICES.md",
]
keywords = ["image alignment", "cryo-EM", "MAP-EM", "multiprocessing", "scientific computing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy",
  "scipy",
  "opencv-python-headless",
]

[project.optional-dependencies]
io = [
  "mrcfile",
]
plot = [
  "matplotlib",
  "pandas",
]
dev = [
  "pytest",
  "build",
  "wheel",
  "twine",
  "mrcfile",
  "matplotlib",
  "pandas",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "packages/alignimg-gpu/src", "packages/alignimg-gui/src"]
markers = [
  "integration: optional tests that require local real-data files and extra IO dependencies",
  "multiprocessing: optional tests that require process-pool multiprocessing support",
]
